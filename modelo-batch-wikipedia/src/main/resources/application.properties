spring.application.name=@project.artifactId@
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Banco H2 em memoria: metadados do Spring Batch + tabela pagina_wikipedia
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:modelo-batch-wikipedia;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=embedded
spring.batch.jdbc.initialize-schema=embedded
spring.h2.console.enabled=${H2_CONSOLE_HABILITADO:true}

# O job nao roda no startup; quem dispara e o agendamento (ou o endpoint manual)
spring.batch.job.enabled=false

# ---------------------------------------------------------------------------
# Agendamento (cron do Spring: segundo minuto hora dia mes dia-da-semana)
# ---------------------------------------------------------------------------
agendamento.extracao-wikipedia.habilitado=${AGENDAMENTO_HABILITADO:true}
agendamento.extracao-wikipedia.cron=${EXTRACAO_WIKIPEDIA_CRON:0 */5 * * * *}

# ---------------------------------------------------------------------------
# Wikipedia
# A politica da Wikimedia pede um User-Agent identificavel, de preferencia com contato:
# https://meta.wikimedia.org/wiki/User-Agent_policy  (sobrescreva com WIKIPEDIA_USER_AGENT)
# ---------------------------------------------------------------------------
wikipedia.base-url=${WIKIPEDIA_BASE_URL:https://pt.wikipedia.org}
wikipedia.user-agent=${WIKIPEDIA_USER_AGENT:modelo-batch-wikipedia/1.0 (projeto de estudo Spring Batch)}
wikipedia.timeout=10s
wikipedia.paginas-por-execucao=${WIKIPEDIA_PAGINAS_POR_EXECUCAO:5}
wikipedia.intervalo-entre-requisicoes=500ms
wikipedia.tamanho-chunk=5
wikipedia.limite-falhas=2
wikipedia.tamanho-maximo-resumo=1000

# ---------------------------------------------------------------------------
# Actuator (probes de liveness/readiness)
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
# Log (configuracao padrao do Spring Boot, texto no console)
# ---------------------------------------------------------------------------
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.io.github.gabriellyra.modelo=${LOG_LEVEL:INFO}
