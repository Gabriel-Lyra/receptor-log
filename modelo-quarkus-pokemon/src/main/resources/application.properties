quarkus.application.name=modelo-quarkus-pokemon
quarkus.http.port=${SERVER_PORT:8081}
%test.quarkus.http.test-port=0

# ---------------------------------------------------------------------------
# H2 em memoria: a tabela e recriada e populada (import.sql) a cada startup
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:pokemon;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=${LOG_SQL:false}

# ---------------------------------------------------------------------------
# Documentacao e health
#   Swagger UI: /q/swagger-ui   OpenAPI: /q/openapi   Health: /q/health
# ---------------------------------------------------------------------------
quarkus.swagger-ui.always-include=true

# ---------------------------------------------------------------------------
# Log (configuracao padrao do Quarkus, texto no console)
# ---------------------------------------------------------------------------
quarkus.log.level=${LOG_LEVEL_ROOT:INFO}
quarkus.log.category."io.github.gabriellyra.modelo".level=${LOG_LEVEL:INFO}
%test.quarkus.log.category."io.github.gabriellyra.modelo".level=DEBUG

# ---------------------------------------------------------------------------
# Logs: stack corporativa (endpoints QUARKUS_OTEL_EXPORTER_OTLP_*_ENDPOINT vindos do deploy)
# + segunda via para o receptor-log (vazio = desligado)
# ---------------------------------------------------------------------------
quarkus.otel.logs.enabled=true
quarkus.otel.metrics.enabled=true
receptor-log.endpoint=${RECEPTOR_LOG_ENDPOINT:}
receptor-log.token=${RECEPTOR_LOG_TOKEN:}
%test.quarkus.otel.sdk.disabled=true
