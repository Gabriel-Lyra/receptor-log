# ---------------------------------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------------------------------
quarkus.http.port=${PORTA:8080}
# Limite do corpo como chega (comprimido). O limite depois de descomprimir e receptor.requisicao.*
quarkus.http.limits.max-body-size=16M
# O receptor descomprime por conta propria, com teto (ver Descompressor)
quarkus.http.enable-decompression=false

# ---------------------------------------------------------------------------------------------------
# Desligamento (passo 1.4). Total ate ~27 s, dentro dos 30 s padrao do terminationGracePeriodSeconds:
#   delay 5 s     readiness responde 503 (o Kubernetes tira o pod do Service), mas ainda aceita requisicoes
#   timeout 10 s  espera as requisicoes em andamento
#   envio final   fecha os segmentos e envia ao S3 em ate RECEPTOR_S3_PRAZO_ENVIO_FINAL (12 s)
# Requisicao que chega depois de os segmentos fecharem recebe 503 (o cliente reenvia para outra replica).
# ---------------------------------------------------------------------------------------------------
quarkus.shutdown.delay-enabled=true
quarkus.shutdown.delay=${RECEPTOR_ESPERA_DESLIGAMENTO:5s}
quarkus.shutdown.timeout=10s

# ---------------------------------------------------------------------------------------------------
# Buffer local (disco efemero do pod)
# ---------------------------------------------------------------------------------------------------
receptor.buffer.diretorio=${RECEPTOR_BUFFER_DIRETORIO:./buffer}
# Segmento aberto fecha com o que vier primeiro: 30 min, 1 MB comprimido ou troca de hora (UTC).
# No maximo 2 arquivos por hora por servico e replica. A idade e tambem o que se perde se o pod morrer de repente.
receptor.segmento.idade-maxima=${RECEPTOR_SEGMENTO_IDADE_MAXIMA:30m}
receptor.segmento.tamanho-maximo-bytes=${RECEPTOR_SEGMENTO_TAMANHO_MAXIMO_BYTES:1048576}
receptor.segmento.verificacao=5s
receptor.requisicao.tamanho-maximo-descomprimido-bytes=67108864
# Teto do buffer (passo 1.3): abaixo do ephemeral storage do pod, com folga. Acima dele, descarta os prontos mais
# antigos (WARN) e, se nem assim couber, responde 503. RECEPTOR_BUFFER_TETO_BYTES
receptor.buffer.teto-bytes=${RECEPTOR_BUFFER_TETO_BYTES:1073741824}

# ---------------------------------------------------------------------------------------------------
# Token por servico (passo 1.5), so por variavel de ambiente:
#   RECEPTOR_TOKENS=modelo-quarkus-pokemon:token1,modelo-batch-wikipedia:token2
#   Exigido em /v1/logs como "Authorization: Bearer <token>". Cada token so manda log com o service.name dele
#   (outro servico = 403). Repita o servico com dois tokens para trocar sem parada.
#   Sem RECEPTOR_TOKENS o receptor NAO SOBE, exceto nos perfis dev e test.
# ---------------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------------
# Envio ao S3 (passo 1.2). Configuracao so por variavel de ambiente (ver ConfiguracaoS3):
#   RECEPTOR_S3_BUCKET        vazio = envio desligado; os arquivos ficam em prontos/
#   RECEPTOR_S3_ENDPOINT      ex.: http://localhost:9090 (S3Mock). Vazio = AWS
#   RECEPTOR_S3_PREFIXO       ex.: logs
#   RECEPTOR_S3_REGIAO        padrao us-east-1
#   RECEPTOR_S3_PATH_STYLE    padrao true (S3 compativel quase sempre exige)
#   RECEPTOR_S3_CHAVE_ACESSO / RECEPTOR_S3_CHAVE_SECRETA
#                             sem as duas, usa a cadeia padrao do SDK (AWS_ACCESS_KEY_ID etc.)
#   RECEPTOR_S3_PRAZO_ENVIO_FINAL  padrao 12s (envio final no desligamento)
# ---------------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------------
# Log do proprio receptor: console + stack corporativa (como qualquer servico, pela configuracao padrao de observabilidade).
# Os endpoints vem do deploy (ex.: values.yaml do Helm): QUARKUS_OTEL_EXPORTER_OTLP_{LOGS,METRICS}_ENDPOINT=http://$(OTEL_K8S_NODE_IP):4317
# E la que o alarme enxerga o "HOUVE PERDA DE LOG" do resumo. O receptor NUNCA manda log para si mesmo.
# Traces desligados: cada POST /v1/logs viraria um trace (ruido na conta da monitoracao).
# ---------------------------------------------------------------------------------------------------
quarkus.application.name=receptor-log
quarkus.otel.logs.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.traces.enabled=false
quarkus.log.level=INFO
quarkus.log.category."io.github.gabriellyra.receptorlog".level=${LOG_LEVEL:INFO}

# ---------------------------------------------------------------------------------------------------
# Testes
# ---------------------------------------------------------------------------------------------------
%test.receptor.buffer.diretorio=target/buffer-teste
%test.quarkus.http.test-port=0
%test.receptor.requisicao.tamanho-maximo-descomprimido-bytes=1048576
%test.receptor.instancia=pod-teste
%test.quarkus.shutdown.delay=0s
%test.receptor.token-obrigatorio=false
# Teste nunca envia ao S3, mesmo com RECEPTOR_S3_BUCKET no .env ou no ambiente
%test.receptor.s3.envio-habilitado=false
%test.quarkus.otel.sdk.disabled=true
%dev.receptor.token-obrigatorio=false
