spring.datasource.url=jdbc:h2:mem:modelo-batch-wikipedia-test;DB_CLOSE_DELAY=-1
spring.sql.init.mode=embedded
spring.batch.jdbc.initialize-schema=embedded
spring.batch.job.enabled=false

agendamento.extracao-wikipedia.habilitado=false
agendamento.extracao-wikipedia.cron=-

wikipedia.base-url=http://localhost:0
wikipedia.user-agent=modelo-batch-wikipedia-teste
wikipedia.timeout=2s
wikipedia.paginas-por-execucao=3
wikipedia.intervalo-entre-requisicoes=0ms
wikipedia.tamanho-chunk=2
wikipedia.limite-falhas=1
wikipedia.tamanho-maximo-resumo=1000

logging.level.io.github.gabriellyra.modelo=DEBUG
